<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05090b" />
    <title>EchoBound · 외부 맵 에디터</title>
  </head>
  <body>
    <main class="editor-shell">
      <header class="editor-header">
        <div><span class="eyebrow">ECHObound / WORLD FORGE</span><h1>맵 에디터</h1></div>
        <div class="stage-fields">
          <label>ID <input id="stage-id" /></label>
          <label>이름 <input id="stage-name" /></label>
          <label>W <input id="stage-width" type="number" min="480" step="20" /></label>
          <label>H <input id="stage-height" type="number" min="270" step="20" /></label>
          <button id="apply-stage" type="button">맵 크기 적용</button>
        </div>
      </header>

      <aside class="tool-rail" aria-label="배치 도구">
        <div id="tool-buttons" class="tool-buttons"></div>
        <div class="rail-actions">
          <button id="duplicate" type="button">복제</button>
          <button id="delete" type="button">삭제</button>
        </div>
      </aside>

      <section class="map-panel">
        <div class="map-toolbar">
          <span id="status">선택 도구</span>
          <label>격자 <select id="grid-size"><option>10</option><option selected>20</option><option>40</option><option>60</option></select>px</label>
          <label>확대 <input id="zoom" type="range" min="15" max="100" value="35" /><span id="zoom-value">35%</span></label>
        </div>
        <div id="canvas-viewport" class="canvas-viewport">
          <canvas id="map-canvas" aria-label="스테이지 편집 캔버스"></canvas>
        </div>
      </section>

      <aside class="inspector-panel">
        <h2>선택 항목</h2>
        <p class="inspector-help">항목을 선택하면 게임 스키마 그대로 편집할 수 있습니다. <code>kind</code>에 새 지형·장해물 타입 이름을 넣을 수 있습니다.</p>
        <textarea id="inspector" spellcheck="false" aria-label="선택 항목 JSON"></textarea>
        <button id="apply-inspector" type="button">선택 항목 적용</button>
        <div id="validation" class="validation"></div>
      </aside>

      <section class="export-panel">
        <div class="export-actions">
          <button id="export-json" type="button">JSON 생성</button>
          <button id="export-ts" type="button">TypeScript 생성</button>
          <button id="copy-output" type="button">코드 복사</button>
          <button id="download-json" type="button">JSON 저장</button>
          <button id="import-json" type="button">아래 JSON 불러오기</button>
        </div>
        <textarea id="output" spellcheck="false" aria-label="가져오기 및 내보내기 코드"></textarea>
      </section>
    </main>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
